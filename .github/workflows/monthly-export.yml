name: Monthly Blogin Export

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to export, e.g. 2026-04. Leave empty for previous month."
        required: false
        default: ""
      year:
        description: "Year to export, e.g. 2025. Leave empty unless doing full-year backfill."
        required: false
        default: ""

  schedule:
    - cron: "0 3 1 * *"

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Run export
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            bash run_export.sh --year=${{ github.event.inputs.year }}
          elif [ -n "${{ github.event.inputs.month }}" ]; then
            bash run_export.sh --month=${{ github.event.inputs.month }}
          else
            bash run_export.sh --previous-month
          fi
        env:
          BLOGIN_API_KEY: ${{ secrets.BLOGIN_API_KEY }}

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: |
          rclone copy output/ gdrive:"Blogin posts" --drive-root-folder-id 1U5MOuCz-qsdOUafVIX7nCnqNBM_QMK0v

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blogin-posts-json
          path: output/posts_*.json
