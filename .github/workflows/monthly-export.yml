name: Quarterly Blogin Export

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to export, e.g. 2026-Q1. Leave empty for previous quarter."
        required: false
        default: ""
      year:
        description: "Year to export, e.g. 2025. Leave empty unless doing full-year backfill."
        required: false
        default: ""

  schedule:
    - cron: "0 3 1 1,4,7,10 *"

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Run export
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            bash run_export.sh --year=${{ github.event.inputs.year }}
          elif [ -n "${{ github.event.inputs.quarter }}" ]; then
            bash run_export.sh --quarter=${{ github.event.inputs.quarter }}
          else
            bash run_export.sh --previous-quarter
          fi
        env:
          BLOGIN_API_KEY: ${{ secrets.BLOGIN_API_KEY }}

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: |
          rclone copy output/ gdrive:"Blogin posts" --drive-root-folder-id 1U5MOuCz-qsdOUafVIX7nCnqNBM_QMK0v

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blogin-posts-json
          path: output/posts_*.json
