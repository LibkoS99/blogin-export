name: Monthly Blogin Export

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Run export
        run: bash run_export.sh
        env:
          BLOGIN_API_KEY: ${{ secrets.BLOGIN_API_KEY }}

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blogin-posts-json
          path: posts_*.json
